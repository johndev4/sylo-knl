name: Deploy to Vercel

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "components.json"
      - "eslint.config.mjs"
      - "tsconfig.json"

  # Runs on pull requests for preview deployments
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "components.json"
      - "eslint.config.mjs"
      - "tsconfig.json"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    vercel-${{ github.workflow }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4
      # Set up Node.js 22 with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci
      # Fail fast on lint errors before building
      - name: Lint
        run: npm run lint
      # Pull Vercel project settings and environment variables dynamically
      - name: Pull Vercel project settings
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi
      # Build project into .vercel/output using Vercel's build pipeline
      - name: Build project
        # env:
        #   NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        #   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            npx vercel@latest build --token="$VERCEL_TOKEN"
          fi
      # Deploy the prebuilt artifact
      - name: Deploy to Vercel
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
